# =============================================================================
# KrediZeka - Pytest Yapılandırması
# =============================================================================
# Bu dosya pytest'in test keşfi ve çalıştırma davranışını belirler.
# =============================================================================

[pytest]
# pythonpath = .  →  backend/ kök dizinini Python yoluna ekler.
# Böylece test dosyaları 'from main import app' gibi importları yapabilir.
pythonpath = .

# Testlerin aranacağı dizin
testpaths = tests

# Test dosyası / sınıfı / fonksiyonu adlandırma desenleri
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# pytest-asyncio: async test fonksiyonları otomatik algılansın
asyncio_mode = auto

# Çıktı ayarları:
#   -v        → ayrıntılı (verbose) çıktı
#   --tb=short → kısa traceback (hata izi)
#   --strict-markers → tanımsız marker kullanımını engelle
addopts = -v --tb=short --strict-markers --color=yes
