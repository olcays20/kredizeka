<!DOCTYPE html>

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon (SVG, modern tarayıcılar) + fallback için PNG yok ise SVG zaten yeterli -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Performans: Font preconnect -->

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- SEO -->
    <title>KrediZeka | Yapay Zeka Destekli Finansal Risk Asistanı</title>

    <meta name="author" content="KrediZeka" />

    <meta property="og:type" content="website" />

    <meta property="og:locale" content="tr_TR" />
    <meta property="og:locale:alternate" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:description" content="XGBoost + SHAP explainable AI for credit risk analysis." />
    <meta name="twitter:image" content="/favicon.svg" />

    <!-- Erişilebilirlik: dil değişimi (i18n zaten yapacak ama default) -->
