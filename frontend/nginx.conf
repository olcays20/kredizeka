# =============================================================================
# KrediZeka Frontend - Nginx Yapılandırması
# =============================================================================
# SPA (Single Page Application) için optimize edilmiş Nginx config.
# Tüm route'ları index.html'e yönlendirir → React Router DOM doğru çalışır.
# =============================================================================

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # ─── Gzip Sıkıştırma ─────────────────────────────────────────────────
    # Statik dosyaları sıkıştırarak %70'e kadar bant genişliği tasarrufu
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/json application/xml+rss
               application/x-font-ttf font/opentype image/svg+xml;

    # ─── SPA Routing ─────────────────────────────────────────────────────
    # /admin, /profil gibi tüm istemci rotaları index.html'e yönlensin
    # (404 yerine React Router devralır)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─── Statik Asset Önbellekleme ───────────────────────────────────────
    # JS/CSS/font/image dosyaları için uzun süreli cache (immutable hash'li)
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ─── Güvenlik Başlıkları ─────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
